# Configuración de Email para TELITO_BODEGUERO
# Configura las credenciales de tu cuenta de Gmail (o otro proveedor SMTP)

# Email del remitente (ej: tu_email@gmail.com)
email.from=telitobodeguero@gmail.com

# Contraseña de aplicación de Gmail (16 caracteres)
# Para crear una contraseña de aplicación:
# 1. Ve a tu cuenta de Google
# 2. Seguridad > Verificación en 2 pasos
# 3. Contraseñas de aplicaciones > Generar nueva
# 4. Copia la contraseña de 16 caracteres aquí
email.password=jjjk mscy txcq xhsr

# Configuración SMTP (Gmail por defecto)
smtp.host=smtp.gmail.com
smtp.port=587

# Para usar otro proveedor SMTP, ajusta estos valores:
# Outlook: smtp.office365.com, puerto 587
# Yahoo: smtp.mail.yahoo.com, puerto 587
# Otro: consulta la documentación de tu proveedor

# URL base de la aplicación (para enlaces en correos)
# Debe incluir el protocolo, dominio, puerto y context path
# Ejemplo: http://54.86.174.59:8080/TELITO_BODEGUERO-1.0-SNAPSHOT
application.base.url=http://54.86.174.59:8080/TELITO_BODEGUERO-1.0-SNAPSHOT

