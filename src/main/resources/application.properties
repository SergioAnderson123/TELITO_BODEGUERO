# Configuración de Base de Datos Local
spring.datasource.url=jdbc:mysql://localhost:3306/telito_bodeguero
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del servidor
server.port=8080
server.servlet.context-path=/TELITO_BODEGUERO

# Configuración de JSPs
# Los JSPs están en webapp/ y Spring Boot los sirve automáticamente en un WAR ejecutable
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Configuración de archivos estáticos
# Los recursos estáticos están en webapp/ y Spring Boot los sirve automáticamente
spring.web.resources.add-mappings=true

# Deshabilitar caché en desarrollo
spring.web.resources.cache.period=0

# Permitir sobrescritura de beans (necesario para Servlets duplicados)
spring.main.allow-bean-definition-overriding=true

# Configuración de correo (ajustar según tus credenciales)
