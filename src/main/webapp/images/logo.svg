<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006d77;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#83c5be;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#83c5be;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006d77;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e0f2f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Círculo de fondo decorativo -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGradient)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.2"/>
  
  <!-- Bodega/Almacén principal con sombra -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Techo del almacén con más detalle -->
    <path d="M -65 -25 L 0 -60 L 65 -25 L 65 -15 L -65 -15 Z" 
          fill="url(#logoGradient)" 
          stroke="#004f56" 
          stroke-width="2.5"/>
    
    <!-- Líneas del techo para dar profundidad -->
    <line x1="0" y1="-60" x2="0" y2="-15" stroke="#004f56" stroke-width="1.5" opacity="0.3"/>
    <line x1="-32" y1="-42" x2="-32" y2="-15" stroke="#004f56" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="-42" x2="32" y2="-15" stroke="#004f56" stroke-width="1" opacity="0.2"/>
    
    <!-- Cuerpo del almacén -->
    <rect x="-65" y="-15" width="130" height="75" 
          fill="#ffffff" 
          stroke="url(#logoGradient)" 
          stroke-width="3.5"
          rx="2"/>
    
    <!-- Puerta grande del almacén -->
    <rect x="-32" y="15" width="64" height="45" 
          fill="url(#boxGradient)" 
          stroke="#004f56" 
          stroke-width="2.5"
          rx="2"/>
    
    <!-- Manija de la puerta -->
    <circle cx="18" cy="37" r="3" fill="#004f56"/>
    
    <!-- Detalle de la puerta (líneas verticales) -->
    <line x1="-10" y1="15" x2="-10" y2="60" stroke="#004f56" stroke-width="2" opacity="0.4"/>
    <line x1="10" y1="15" x2="10" y2="60" stroke="#004f56" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="15" x2="0" y2="60" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Ventanas del almacén (más grandes) -->
    <rect x="-55" y="-5" width="18" height="15" 
          fill="#83c5be" 
          stroke="#006d77" 
          stroke-width="2"
          rx="1"/>
    <line x1="-46" y1="-5" x2="-46" y2="10" stroke="#006d77" stroke-width="1"/>
    
    <rect x="37" y="-5" width="18" height="15" 
          fill="#83c5be" 
          stroke="#006d77" 
          stroke-width="2"
          rx="1"/>
    <line x1="46" y1="-5" x2="46" y2="10" stroke="#006d77" stroke-width="1"/>
    
    <!-- Cajas/Inventario stack (izquierda) - más detalladas -->
    <g transform="translate(-52, 25)">
      <!-- Caja inferior -->
      <rect x="0" y="0" width="15" height="15" 
            fill="url(#boxGradient)" 
            stroke="#004f56" 
            stroke-width="2"
            rx="1"/>
      <line x1="0" y1="7.5" x2="15" y2="7.5" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <line x1="7.5" y1="0" x2="7.5" y2="15" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <circle cx="7.5" cy="7.5" r="2" fill="#ffffff" opacity="0.3"/>
      
      <!-- Caja superior -->
      <rect x="0" y="-15" width="15" height="15" 
            fill="url(#boxGradient)" 
            stroke="#004f56" 
            stroke-width="2"
            rx="1"/>
      <line x1="0" y1="-7.5" x2="15" y2="-7.5" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <line x1="7.5" y1="-15" x2="7.5" y2="0" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <circle cx="7.5" cy="-7.5" r="2" fill="#ffffff" opacity="0.3"/>
    </g>
    
    <!-- Cajas stack (derecha) -->
    <g transform="translate(57, 25)">
      <!-- Caja inferior -->
      <rect x="0" y="0" width="15" height="15" 
            fill="url(#boxGradient)" 
            stroke="#004f56" 
            stroke-width="2"
            rx="1"/>
      <line x1="0" y1="7.5" x2="15" y2="7.5" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <line x1="7.5" y1="0" x2="7.5" y2="15" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <circle cx="7.5" cy="7.5" r="2" fill="#ffffff" opacity="0.3"/>
      
      <!-- Caja superior -->
      <rect x="0" y="-15" width="15" height="15" 
            fill="url(#boxGradient)" 
            stroke="#004f56" 
            stroke-width="2"
            rx="1"/>
      <line x1="0" y1="-7.5" x2="15" y2="-7.5" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <line x1="7.5" y1="-15" x2="7.5" y2="0" stroke="#004f56" stroke-width="1.5" opacity="0.5"/>
      <circle cx="7.5" cy="-7.5" r="2" fill="#ffffff" opacity="0.3"/>
    </g>
    
    <!-- Símbolo de verificación/check (control de inventario) - más grande -->
    <circle cx="0" cy="-48" r="18" fill="#20c997" stroke="#ffffff" stroke-width="2"/>
    <path d="M -7 -48 L -3 -42 L 8 -55" 
          stroke="#ffffff" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Detalles decorativos alrededor -->
  <circle cx="30" cy="170" r="3" fill="#83c5be" opacity="0.5"/>
  <circle cx="170" cy="170" r="3" fill="#83c5be" opacity="0.5"/>
  <circle cx="30" cy="30" r="2" fill="#20c997" opacity="0.4"/>
  <circle cx="170" cy="30" r="2" fill="#20c997" opacity="0.4"/>
</svg>
